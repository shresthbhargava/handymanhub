spring:
  datasource:
    url: jdbc:h2:file:./data/handymanhub;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: false
server:
  port: ${PORT:8080}
logging:
  level:
    com.handymanhub: INFO
