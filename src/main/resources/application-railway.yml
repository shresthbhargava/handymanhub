spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectTimeout=10000
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
  flyway:
    enabled: false

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 5
      min-spare: 1

logging:
  level:
    com.handymanhub: INFO
    org.hibernate.SQL: WARN
