spring:
  datasource:
    url: jdbc:h2:mem:handymanhub_test;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

rate-limit:
  max-requests: 1000
  window-minutes: 60